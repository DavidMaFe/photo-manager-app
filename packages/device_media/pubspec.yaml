name: device_media
description: "Gallery of the device for Photo Manager: MediaStore ids, free space and saving files in chunks (Android)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.photomanagerpro.device_media
        pluginClass: DeviceMediaPlugin
